[package]
name = "fixmytype-input-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
fixmytype-input-core = { path = "../../crates/input-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security"] }
